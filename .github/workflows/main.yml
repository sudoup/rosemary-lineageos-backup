name: Download LineageOS rosemary builds

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get latest build info
        id: build
        run: |
          API="https://download.lineageos.org/api/v1/rosemary/nightly/1"
          curl -sL "$API" -o builds.json

          FILENAME=$(jq -r '.response[0].filename' builds.json)
          URL=$(jq -r '.response[0].url' builds.json)
          VERSION=$(jq -r '.response[0].version' builds.json)
          EXPECTED_SHA256=$(jq -r '.response[0].id' builds.json)
          SIZE=$(jq -r '.response[0].size' builds.json)

          DATE=$(echo "$FILENAME" | grep -oP '\d{8}')
          BASE_URL=$(dirname "$URL")
          TAG="lineage-${VERSION}-${DATE}"

          echo "filename=$FILENAME"               >> $GITHUB_OUTPUT
          echo "url=$URL"                         >> $GITHUB_OUTPUT
          echo "version=$VERSION"                 >> $GITHUB_OUTPUT
          echo "date=$DATE"                       >> $GITHUB_OUTPUT
          echo "base_url=$BASE_URL"               >> $GITHUB_OUTPUT
          echo "tag=$TAG"                         >> $GITHUB_OUTPUT
          echo "expected_sha256=$EXPECTED_SHA256" >> $GITHUB_OUTPUT
          echo "size=$SIZE"                       >> $GITHUB_OUTPUT

          echo "=== Latest build ==="
          echo "File:     $FILENAME"
          echo "Version:  $VERSION"
          echo "Date:     $DATE"
          echo "SHA256:   $EXPECTED_SHA256"
          echo "Size:     $SIZE bytes"
          echo "Base URL: $BASE_URL"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.build.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.build.outputs.tag }} already exists — no changes, skipping download"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "New build found: ${{ steps.build.outputs.tag }}"
          fi

      - name: Free disk space
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Checkout
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Download and verify all files
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p download
          cd download

          BASE="${{ steps.build.outputs.base_url }}"
          ZIP="${{ steps.build.outputs.filename }}"

          FILES=(
            "$ZIP"
            "boot.img"
            "dtbo.img"
            "lk.img"
            "super_empty.img"
            "vbmeta.img"
            "build-manifest.xml"
          )

          echo "=== Fetching official SHA256 from mirrorbits ==="
          > OFFICIAL.sha256

          for f in "${FILES[@]}"; do
            echo -n "  $f ... "
            HASH_LINE=$(curl -sL --retry 5 "$BASE/$f?sha256")
            HASH=$(echo "$HASH_LINE" | awk '{print $1}')

            if [[ ! "$HASH" =~ ^[a-f0-9]{64}$ ]]; then
              echo "FAILED (invalid response: $HASH_LINE)"
              exit 1
            fi

            echo "$HASH  $f" >> OFFICIAL.sha256
            echo "$HASH"
          done

          echo ""
          cat OFFICIAL.sha256
          echo ""

          for f in "${FILES[@]}"; do
            echo "Downloading $f ..."
            curl -fL --retry 8 --retry-delay 15 -C - -o "$f" "$BASE/$f"
          done

          echo ""
          ls -lh
          echo ""

          echo "=== Calculating local SHA256 ==="
          sha256sum "${FILES[@]}" > LOCAL.sha256
          cat LOCAL.sha256
          echo ""

          echo "=== Verifying against official hashes ==="
          if sha256sum -c OFFICIAL.sha256; then
            echo "All files match official hashes from LineageOS"
          else
            echo "::error::SHA256 mismatch"
            exit 1
          fi

          cp OFFICIAL.sha256 SHA256SUMS

          {
            echo "### Official SHA256 (from LineageOS mirrorbits)"
            echo '```'
            cat OFFICIAL.sha256
            echo '```'
            echo ""
            echo "### Local SHA256 (calculated after download)"
            echo '```'
            cat LOCAL.sha256
            echo '```'
          } > ../checksums.md

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          DATE="${{ steps.build.outputs.date }}"

          NOTES=$(cat <<EOF
          Official LineageOS **${VERSION}** nightly for **rosemary** (${DATE})

          $(cat checksums.md)

          ### Files
          - \`${{ steps.build.outputs.filename }}\`
          - \`boot.img\`
          - \`dtbo.img\`
          - \`lk.img\`
          - \`super_empty.img\`
          - \`vbmeta.img\`
          - \`build-manifest.xml\`
          - \`SHA256SUMS\`

          Source: https://download.lineageos.org/devices/rosemary/builds
          EOF
          )

          gh release create "$TAG" \
            --title "LineageOS ${VERSION} (${DATE})" \
            --notes "$NOTES" \
            ./download/*

      - name: Keep only latest 2 releases
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t RELEASES < <(gh release list --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')

          echo "Current releases: ${RELEASES[*]}"

          if [ ${#RELEASES[@]} -gt 2 ]; then
            for ((i=2; i<${#RELEASES[@]}; i++)); do
              echo "Deleting old release: ${RELEASES[$i]}"
              gh release delete "${RELEASES[$i]}" --yes --cleanup-tag
            done
          else
            echo "2 or fewer releases, nothing to delete"
          fi
